name: Build Caisse MAMINAINA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet V1.4
        run: |
          unzip -o CAISSE_MAMINAINA_V14_GITHUB.zip -d .
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm install

      - name: Créer Android
        run: npx cap add android

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Compiler APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CAISSE-MAMINAINA-V14
          path: android/app/build/outputs/apk/debug/app-debug.apk
